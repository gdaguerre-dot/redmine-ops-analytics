<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#a4342f"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="640" fill="#f6f4ee"/>

  <!-- Row 1 -->
  <rect x="20" y="30" width="150" height="56" rx="8" fill="#ffffff" stroke="#2c5f6f" stroke-width="1.5"/>
  <text x="95" y="63" text-anchor="middle" font-family="Arial" font-size="14" font-weight="600" fill="#161a1f">310 tickets</text>

  <rect x="215" y="30" width="190" height="56" rx="8" fill="#ffffff" stroke="#2c5f6f" stroke-width="1.5"/>
  <text x="310" y="55" text-anchor="middle" font-family="Arial" font-size="14" font-weight="600" fill="#161a1f">Texto original</text>
  <text x="310" y="72" text-anchor="middle" font-family="Arial" font-size="11" fill="#4b5259">asunto + descripción</text>

  <rect x="450" y="30" width="220" height="56" rx="8" fill="#ffffff" stroke="#2c5f6f" stroke-width="1.5"/>
  <text x="560" y="55" text-anchor="middle" font-family="Arial" font-size="14" font-weight="600" fill="#161a1f">Preprocessing</text>
  <text x="560" y="72" text-anchor="middle" font-family="Arial" font-size="11" fill="#4b5259">limpieza, normalización, stopwords</text>

  <line x1="170" y1="58" x2="215" y2="58" stroke="#a4342f" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="405" y1="58" x2="450" y2="58" stroke="#a4342f" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- split down from preprocessing -->
  <line x1="560" y1="86" x2="560" y2="120" stroke="#a4342f" stroke-width="2"/>
  <line x1="440" y1="120" x2="680" y2="120" stroke="#a4342f" stroke-width="2"/>
  <line x1="440" y1="120" x2="440" y2="150" stroke="#a4342f" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="680" y1="120" x2="680" y2="150" stroke="#a4342f" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 2: TF-IDF + BERTopic -->
  <rect x="330" y="150" width="220" height="60" rx="8" fill="#eef5f5" stroke="#2c5f6f" stroke-width="1.5"/>
  <text x="440" y="176" text-anchor="middle" font-family="Arial" font-size="14" font-weight="600" fill="#161a1f">TF-IDF</text>
  <text x="440" y="194" text-anchor="middle" font-family="Arial" font-size="11" fill="#4b5259">términos característicos por grupo</text>

  <rect x="570" y="150" width="220" height="60" rx="8" fill="#eef5f5" stroke="#2c5f6f" stroke-width="1.5"/>
  <text x="680" y="176" text-anchor="middle" font-family="Arial" font-size="14" font-weight="600" fill="#161a1f">BERTopic</text>
  <text x="680" y="194" text-anchor="middle" font-family="Arial" font-size="11" fill="#4b5259">tópicos latentes</text>

  <!-- converge to sentiment -->
  <line x1="440" y1="210" x2="440" y2="240" stroke="#a4342f" stroke-width="2"/>
  <line x1="680" y1="210" x2="680" y2="240" stroke="#a4342f" stroke-width="2"/>
  <line x1="440" y1="240" x2="680" y2="240" stroke="#a4342f" stroke-width="2"/>
  <line x1="560" y1="240" x2="560" y2="260" stroke="#a4342f" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 3: Sentiment -->
  <rect x="440" y="260" width="240" height="56" rx="8" fill="#ffffff" stroke="#2c5f6f" stroke-width="1.5"/>
  <text x="560" y="285" text-anchor="middle" font-family="Arial" font-size="14" font-weight="600" fill="#161a1f">Sentiment</text>
  <text x="560" y="302" text-anchor="middle" font-family="Arial" font-size="11" fill="#4b5259">pysentimiento (español)</text>

  <line x1="560" y1="316" x2="560" y2="350" stroke="#a4342f" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 4: Segmentación -->
  <rect x="360" y="350" width="400" height="70" rx="8" fill="#ffffff" stroke="#2c5f6f" stroke-width="1.5"/>
  <text x="560" y="376" text-anchor="middle" font-family="Arial" font-size="14" font-weight="600" fill="#161a1f">Segmentación</text>
  <text x="560" y="394" text-anchor="middle" font-family="Arial" font-size="11" fill="#4b5259">correctivo/evolutivo · negativo/positivo · módulo</text>
  <text x="560" y="410" text-anchor="middle" font-family="Arial" font-size="10" fill="#a4342f">cada grupo se reporta con su n</text>

  <line x1="560" y1="420" x2="560" y2="440" stroke="#a4342f" stroke-width="2"/>
  <line x1="440" y1="440" x2="680" y2="440" stroke="#a4342f" stroke-width="2"/>
  <line x1="440" y1="440" x2="440" y2="470" stroke="#a4342f" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="680" y1="440" x2="680" y2="470" stroke="#a4342f" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 5: outputs -->
  <rect x="320" y="470" width="240" height="66" rx="8" fill="#eef5f5" stroke="#2c5f6f" stroke-width="1.5"/>
  <text x="440" y="496" text-anchor="middle" font-family="Arial" font-size="13" font-weight="600" fill="#161a1f">Términos característicos</text>
  <text x="440" y="514" text-anchor="middle" font-family="Arial" font-size="11" fill="#4b5259">tabla TF-IDF por segmento</text>
  <text x="440" y="529" text-anchor="middle" font-family="Arial" font-size="10" fill="#4b5259">(word cloud como apoyo visual)</text>

  <rect x="580" y="470" width="240" height="66" rx="8" fill="#eef5f5" stroke="#2c5f6f" stroke-width="1.5"/>
  <text x="700" y="496" text-anchor="middle" font-family="Arial" font-size="13" font-weight="600" fill="#161a1f">Fricción real por módulo</text>
  <text x="700" y="514" text-anchor="middle" font-family="Arial" font-size="11" fill="#4b5259">cruce volumen × sentimiento</text>
  <text x="700" y="529" text-anchor="middle" font-family="Arial" font-size="10" fill="#4b5259">(ya presente en el análisis actual)</text>

  <line x1="440" y1="536" x2="440" y2="560" stroke="#a4342f" stroke-width="2"/>
  <line x1="700" y1="536" x2="700" y2="560" stroke="#a4342f" stroke-width="2"/>
  <line x1="440" y1="560" x2="700" y2="560" stroke="#a4342f" stroke-width="2"/>
  <line x1="570" y1="560" x2="570" y2="580" stroke="#a4342f" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Final: Insights -->
  <rect x="460" y="580" width="220" height="50" rx="8" fill="#fbf7ec" stroke="#c99a3e" stroke-width="1.5"/>
  <text x="570" y="611" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#161a1f">Insights</text>
</svg>
